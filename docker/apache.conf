# Standalone configuration: no distribution aliases, status pages or secondary listeners.
ServerRoot "/etc/apache2"
LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
LoadModule php_module /usr/lib/apache2/modules/libphp.so

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Listen 0.0.0.0:${PORT}
DefaultRuntimeDir /tmp
PidFile /tmp/fit-home-apache.pid
User www-data
Group www-data
StartServers 1
MinSpareServers 1
MaxSpareServers 2
MaxRequestWorkers 3
MaxConnectionsPerChild 500
GracefulShutdownTimeout 25
KeepAliveTimeout 2
Timeout 110

ErrorLog /proc/self/fd/2
LogLevel warn
# Exclude query strings, headers, cookies and request bodies.
LogFormat "%m %U %>s %D" fit_home
CustomLog /proc/self/fd/1 fit_home
TypesConfig /etc/mime.types
DocumentRoot "/var/www/html/public"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "/var/www/html/public">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    RewriteEngine On
    RewriteRule "(^|/)\." - [F]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [END]
    <Files "index.php">
        SetHandler application/x-httpd-php
    </Files>
</Directory>
